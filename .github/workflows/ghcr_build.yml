name: Build and Publish Docker Image to GHCR

permissions:
  contents: read

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

concurrency:
  group: ghcr-deploy
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/suggestarr

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      deploy_sha: ${{ steps.sha.outputs.value }}
    steps:
      - name: Checkout deploy branch
        uses: actions/checkout@v7.0.0
        with:
          ref: deploy

      - name: Record deploy commit SHA
        id: sha
        run: echo "value=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout deploy branch
        uses: actions/checkout@v7.0.0
        with:
          ref: deploy

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare platform slug
        id: prep
        run: echo "platform_slug=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> $GITHUB_OUTPUT

      - name: Build and push platform image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.prepare.outputs.deploy_sha }}-${{ steps.prep.outputs.platform_slug }}
          cache-from: type=gha,scope=ghcr-${{ matrix.platform }}
          cache-to: type=gha,scope=ghcr-${{ matrix.platform }},mode=max

  merge:
    needs: [prepare, build]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Create and push multi-platform manifest
        env:
          VERSION: ${{ needs.prepare.outputs.deploy_sha }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:deploy" \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${VERSION}" \
            "${IMAGE}:${VERSION}-linux-amd64" \
            "${IMAGE}:${VERSION}-linux-arm64"
