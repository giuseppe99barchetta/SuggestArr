name: Rebuild deploy branch

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'ci/**'
  workflow_dispatch:

concurrency:
  group: rebuild-deploy
  cancel-in-progress: true

jobs:
  rebuild:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      deploy_sha: ${{ steps.deploy.outputs.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Rebuild deploy from main plus topic branches
        id: deploy
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail

          git fetch origin --prune

          if ! git show-ref --verify --quiet refs/remotes/origin/main; then
            echo "::error::origin/main not found"
            exit 1
          fi

          git checkout -B deploy origin/main

          collect_branches() {
            git for-each-ref --format='%(refname:short)' refs/remotes/origin/ \
              | sed 's|^origin/||' \
              | grep -E "$1" \
              | sort -u
          }

          branches=()
          while IFS= read -r branch; do branches+=("$branch"); done < <(collect_branches '^ci/')
          while IFS= read -r branch; do branches+=("$branch"); done < <(collect_branches '^fix/')
          while IFS= read -r branch; do branches+=("$branch"); done < <(collect_branches '^feat/')

          if [ "${#branches[@]}" -eq 0 ]; then
            echo "No topic branches to merge; deploy will match main."
          fi

          merged=()
          skipped=()
          for branch in "${branches[@]}"; do
            if git merge-base --is-ancestor "origin/${branch}" HEAD 2>/dev/null; then
              echo "Skipping origin/${branch} (already contained in deploy)"
              skipped+=("$branch")
              continue
            fi

            echo "Merging origin/${branch}"
            if git merge --no-ff --no-edit "origin/${branch}"; then
              merged+=("$branch")
              continue
            fi

            echo "::warning::Merge conflict while merging origin/${branch}; skipping superseded branch"
            git merge --abort || true
            skipped+=("$branch")
          done

          echo "Merged branches: ${merged[*]:-none}"
          echo "Skipped branches: ${skipped[*]:-none}"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          git push --force origin deploy

  build:
    needs: rebuild
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/suggestarr

    steps:
      - name: Checkout deploy branch
        uses: actions/checkout@v7.0.0
        with:
          ref: deploy

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare platform slug
        id: prep
        run: echo "platform_slug=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> $GITHUB_OUTPUT

      - name: Build and push platform image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.rebuild.outputs.deploy_sha }}-${{ steps.prep.outputs.platform_slug }}
          cache-from: type=gha,scope=ghcr-${{ matrix.platform }}
          cache-to: type=gha,scope=ghcr-${{ matrix.platform }},mode=max

  merge:
    needs: [rebuild, build]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/suggestarr

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Create and push multi-platform manifest
        env:
          VERSION: ${{ needs.rebuild.outputs.deploy_sha }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:deploy" \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${VERSION}" \
            "${IMAGE}:${VERSION}-linux-amd64" \
            "${IMAGE}:${VERSION}-linux-arm64"
