name: Sync client dependency lockfile

on:
  push:
    branches:
      - nightly
    paths:
      - .github/workflows/sync-client-lock.yml

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout nightly
        uses: actions/checkout@v7.0.1
        with:
          ref: nightly

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '20'

      - name: Regenerate package lock
        working-directory: client
        run: npm install --package-lock-only

      - name: Verify clean install
        working-directory: client
        run: npm ci

      - name: Run frontend tests
        working-directory: client
        run: npm test

      - name: Run ESLint
        working-directory: client
        run: npm run lint

      - name: Run stylelint
        working-directory: client
        run: npm run lint:styles

      - name: Build frontend
        working-directory: client
        run: npm run build

      - name: Install Chromium for E2E
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Run frontend E2E
        working-directory: client
        run: npm run test:e2e

      - name: Commit synchronized lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already synchronized"
            exit 0
          fi
          git commit -m "chore(deps): sync client package lock"
          git pull --rebase origin nightly
          git push origin HEAD:nightly
